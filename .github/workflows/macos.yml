name: macOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Unit tests and UI tests run on separate runners at the same time; each job builds what it tests. UI tests drive the
# one screen a runner has, so they cannot run side by side on one machine.
jobs:
  unit-tests:
    name: Unit tests and builds
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Report build environment
        run: |
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run repository boundary tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run unit tests
        run: ./scripts/verify.sh unit

      - name: Build Release configuration
        if: ${{ success() || failure() }}
        run: ./scripts/verify.sh release-build

      - name: Build with Swift warnings as errors
        if: ${{ success() || failure() }}
        run: ./scripts/verify.sh warnings-build

  ui-tests:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Report build environment
        run: |
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          sw_vers
          xcodebuild -version

      - name: Run native shell UI tests
        run: ./scripts/verify.sh ui

  # The check that protects main. It passes only when both jobs above passed: it always runs, so a failed or cancelled
  # job makes it fail rather than be skipped, and a skipped required check would count as passed.
  native-foundation:
    if: ${{ always() }}
    needs: [unit-tests, ui-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the unit and UI test jobs
        env:
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          UI_TESTS: ${{ needs.ui-tests.result }}
        run: |
          echo "Unit tests and builds: $UNIT_TESTS"
          echo "UI tests: $UI_TESTS"
          test "$UNIT_TESTS" = success
          test "$UI_TESTS" = success
