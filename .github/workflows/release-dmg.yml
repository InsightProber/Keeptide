name: Release DMG

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact-only version (for example 0.1.0-rc.1); never publishes a release'
        required: true
        default: 0.1.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: release-dmg-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Check out source and ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test packaging and publication boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate version and source
        id: metadata
        run: python3 scripts/release_dmg.py prepare > "$RUNNER_TEMP/build-info.json"

      - name: Build and verify disk image
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
          PACKAGE_OUTPUT: ${{ runner.temp }}/release-dmg
        run: |
          python3 scripts/package_dmg.py --version "$PACKAGE_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" --output "$PACKAGE_OUTPUT"
          cp "$RUNNER_TEMP/build-info.json" "$PACKAGE_OUTPUT/build-info.json"

      - name: Store verified test package
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keeptide-DMG-${{ github.run_id }}
          path: ${{ runner.temp }}/release-dmg/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download this run's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Upload and verify existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          python3 scripts/release_dmg.py publish \
            --directory "$RUNNER_TEMP/release-assets" \
            --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID"
